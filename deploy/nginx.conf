# Remotech — Nginx (Ubuntu 24.04)
# Pasang:
#   sudo cp deploy/nginx.conf /etc/nginx/sites-available/remotech
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo ln -s /etc/nginx/sites-available/remotech /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
# (rm site default bawaan Ubuntu — kalau dibiarkan, ia tetap ikut listen port 80.)
# Lalu jalankan certbot (akan menambahkan blok HTTPS otomatis):
#   sudo certbot --nginx -d remotech.web.id -d www.remotech.web.id -d api.remotech.web.id

# ---------------------------------------------------------------------------
# Frontend (React SPA)
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name remotech.web.id www.remotech.web.id;

    root /var/www/remotech;
    index index.html;

    # Cache aset build Vite (nama file mengandung hash)
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — semua route React ke index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ---------------------------------------------------------------------------
# API (Django via Gunicorn)
# ---------------------------------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name api.remotech.web.id;

    client_max_body_size 20M;

    # Static & media disajikan langsung oleh Nginx (lebih cepat daripada via Gunicorn)
    location /static/ {
        alias /home/deploy/remotech/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location /media/ {
        alias /home/deploy/remotech/media/;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Semua request lain → Django
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
