[tool.poetry]
name = "Remotech"
version = "0.1.0"
description = "Remote Challenge - Web based learning system with gamification"
authors = ["Fauzan Hidayat <fauzanhidayat679@gmail.com>"]
readme = "README.md"
packages = [{include = "server"}]

[tool.poetry.dependencies]
python = ">=3.12"
django = ">=6.0.5,<7.0.0"
psycopg2-binary = ">=2.9.10,<3.0.0"
python-decouple = ">=3.8,<4.0"
djangorestframework = "^3.18.0"
drf-standardized-errors = "^0.16.0"
djangorestframework-simplejwt = "^5.5.1"
django-filter = "^26.1"
pillow = "^12.3.0"
nh3 = "^0.3.7"
django-cors-headers = "^4.9.0"
requests = "^2.34.2"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"